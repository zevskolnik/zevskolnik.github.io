# No Not Jeff site settings

title: "No Not Jeff"
tagline: "One lispy adventure at a time"
description: "Travel stories from Zev Skolnik. Newsletters, stories and guides from the road, one lispy adventure at a time."
url: "https://nonotjeff.com"
baseurl: ""
lang: en
timezone: "America/Chicago"

author:
  name: Zev Skolnik
  email: hello@nonotjeff.com

# Images used across the site (in assets/img/site)
hero_image: /assets/img/site/hero-tajumulco-sunrise.webp
hero_caption: "Tajumulco, Guatemala"
profile_image: /assets/img/site/zev.webp
logo: /assets/img/site/not-jeff-sticker.png

# Mailchimp signup form
mailchimp:
  action: "https://gmail.us3.list-manage.com/subscribe/post?u=001a1df06423a9d1c166f620e&id=1a09f87924&f_id=00e52ce2f0"
  honeypot: "b_001a1df06423a9d1c166f620e_1a09f87924"

# Old WordPress links keep working
permalink: /:title/

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post
  - scope: { path: "" }
    values:
      layout: page

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  footnote_backlink: "&#8617;&#xfe0e;"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - tools
  - vendor
  - .devcontainer
  - .vscode
  - .editorconfig
  - .gitattributes
