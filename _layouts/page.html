---
layout: default
---
<article class="page">
  <header class="post-head">
    {% if page.kicker %}<span class="kicker">{{ page.kicker }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="intro">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="prose{% if page.wide %} prose-wide{% endif %}">
{{ content }}
  </div>
</article>
